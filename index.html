<style>
/* Layout: one black luxury stage; a lit 3D magazine sits on a dark surface in the centre. Almost no UI: a whisper of page number and two tiny arrows. Single dark theme by choice. */
:root{
  --black:#000000; --ivory:#F4F0EA; --mist:#8E877F; --dim:#4A4541; --red:#E8C27A;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans:"Jost", "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--black);color:var(--ivory);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#stage{position:relative;height:100vh;height:100svh;overflow:hidden;background:#1a110a}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;outline:none}
#scene.grab{cursor:grab}#scene.grabbing{cursor:grabbing}#scene.link{cursor:pointer}

/* intro veil */
#beam{position:absolute;left:-8vw;top:-20vh;width:70vw;height:120vh;transform:rotate(-38deg);transform-origin:0 0;pointer-events:none;z-index:1;filter:blur(28px);mix-blend-mode:screen;animation:beam 7s ease-in-out infinite}
#beam i{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,196,120,.20),rgba(255,190,110,.07) 55%,rgba(255,190,110,0) 90%);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
@keyframes beam{0%,100%{opacity:.85}50%{opacity:1}}
#vig{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 48%,rgba(40,20,5,0) 48%,rgba(30,14,4,.5) 100%)}
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--black);transition:opacity 1.4s ease, visibility 1.4s}
#intro.gone{opacity:0;visibility:hidden}
.mark{text-align:center;display:grid;gap:14px;justify-items:center}
.mark h1{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(34px,7vw,76px);letter-spacing:.32em;padding-left:.32em;line-height:1;
  animation:breathe 2.4s cubic-bezier(.2,.7,.2,1) both}
.mark p{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(15px,1.8vw,19px);color:var(--mist);animation:fade 1.6s .8s both}
.mark .bar{width:120px;height:1px;background:var(--dim);overflow:hidden;animation:fade 1s 1s both}
.mark .bar i{display:block;height:100%;width:var(--load,0%);background:var(--ivory);transition:width .3s}
@keyframes breathe{from{opacity:0;letter-spacing:.7em;padding-left:.7em}to{opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* whisper UI */
.hud{position:fixed;left:50%;right:auto;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;padding:6px 18px;border-radius:999px;background:rgba(34,20,10,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;gap:18px;pointer-events:none}
.hud button{pointer-events:auto;background:none;border:0;color:var(--mist);font-family:var(--display);font-size:22px;line-height:1;padding:6px 10px;cursor:pointer;transition:color .2s}
.hud button:hover:not(:disabled){color:var(--ivory)}
.hud button:disabled{opacity:.2;cursor:default}
.hud button:focus-visible{outline:1px solid var(--ivory);outline-offset:2px}
@media (max-width:520px){#where .nm{display:none}}
#where{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--mist);min-width:12em;text-align:center}
#where b{color:var(--ivory);font-weight:400}
#hint{position:fixed;left:0;right:0;top:calc(22px + env(safe-area-inset-top,0px));z-index:5;text-align:center;font-family:var(--display);font-style:italic;font-size:14px;color:var(--mist);transition:opacity 1s;pointer-events:none}
#hint.gone{opacity:0}
#hint,.hud{display:none!important}
/* page indicator */
#dots{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;display:flex;gap:9px;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(26,16,9,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#dots button{width:7px;height:7px;padding:0;border:0;border-radius:999px;background:rgba(244,240,234,.42);cursor:pointer;transition:width .35s ease, background .35s ease}
#dots button[aria-current="true"]{width:22px;background:var(--ivory)}
#dots button:focus-visible{outline:1px solid var(--ivory);outline-offset:3px}
#cue{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;color:rgba(244,240,234,.7);text-decoration:none;font-size:18px;line-height:1;padding:2px 10px;animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%,100%{transform:translate(-50%,0);opacity:.55}50%{transform:translate(-50%,4px);opacity:1}}

/* story + contact: vintage invitation scroll */
#story{position:relative;background:#2a1a12 url(s_blur.jpg) center/cover fixed;padding:0 0 clamp(40px,8vh,80px);color:#3d2a22}
#story .sheet{position:relative;max-width:900px;margin:0 auto;box-shadow:0 30px 70px rgba(0,0,0,.45)}
#story .lace{height:34px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2764%27%20height%3D%2734%27%20viewBox%3D%270%200%2064%2034%27%3E%3Cg%20fill%3D%27%23f3ead8%27%3E%3Crect%20width%3D%2764%27%20height%3D%2712%27/%3E%3Cpath%20d%3D%27M0%2012%20h64%20v4%20a16%2016%200%200%201%20-16%2016%20a16%2016%200%200%201%20-16%20-14%20a16%2016%200%200%201%20-16%2014%20a16%2016%200%200%201%20-16%20-16%20z%27/%3E%3C/g%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23d8c8ab%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M0%2015%20a16%2016%200%200%200%2016%2016%20a16%2016%200%200%200%2016%20-14%20a16%2016%200%200%200%2016%2014%20a16%2016%200%200%200%2016%20-16%27/%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2720%27%20r%3D%273.2%27/%3E%3Ccircle%20cx%3D%2748%27%20cy%3D%2720%27%20r%3D%273.2%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%278%27%20r%3D%272.4%27/%3E%3Ccircle%20cx%3D%270%27%20cy%3D%278%27%20r%3D%272.4%27/%3E%3Ccircle%20cx%3D%2764%27%20cy%3D%278%27%20r%3D%272.4%27/%3E%3C/g%3E%3Cg%20fill%3D%27%23d8c8ab%27%3E%3Ccircle%20cx%3D%278%27%20cy%3D%2724%27%20r%3D%271%27/%3E%3Ccircle%20cx%3D%2724%27%20cy%3D%2724%27%20r%3D%271%27/%3E%3Ccircle%20cx%3D%2740%27%20cy%3D%2724%27%20r%3D%271%27/%3E%3Ccircle%20cx%3D%2756%27%20cy%3D%2724%27%20r%3D%271%27/%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%275%27%20r%3D%271.3%27/%3E%3Ccircle%20cx%3D%2748%27%20cy%3D%275%27%20r%3D%271.3%27/%3E%3C/g%3E%3C/svg%3E") repeat-x;position:relative;z-index:2}
#story .lace.up{transform:scaleY(-1)}
#story section{position:relative}
#story .paper{background:#f3ead8 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");padding:clamp(40px,7vw,70px) clamp(20px,6vw,72px)}
.script{font-family:"Pinyon Script",cursive;font-weight:400;color:#5d7a6e;line-height:1}
.serif{font-family:"Cormorant Garamond",var(--display)}
/* hero band */
#story .band{height:clamp(220px,34vw,320px);background:url(s_poppy.jpg) center 45%/cover;display:grid;place-items:center;text-align:center;color:#f6ecd9;position:relative}
#story .band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,6,.25),rgba(20,10,6,.45))}
#story .band > *{position:relative;z-index:1}
#story .band .mono{font-family:"Cormorant Garamond",serif;font-size:28px;letter-spacing:.1em;opacity:.9}
#story .band .pre{font-family:"Pinyon Script",cursive;font-size:clamp(22px,3vw,30px)}
#story .band h2{margin:2px 0 0;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(34px,6vw,62px);letter-spacing:.08em;line-height:1}
#story .band .sub{font-family:"Pinyon Script",cursive;font-size:clamp(24px,3.6vw,36px);margin-top:4px}
/* about */
.about{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:clamp(22px,4vw,44px);align-items:start}
.photos{position:relative;min-height:380px}
.photos .rect{width:78%;aspect-ratio:13/16;background:url(s_walk.jpg) center/cover;box-shadow:0 10px 24px rgba(60,40,20,.25)}
.photos .oval{position:absolute;right:0;bottom:-6px;width:52%;aspect-ratio:9/11;border-radius:50%;background:url(s_self.jpg) center/cover;
  border:9px solid #c9a24f;box-shadow:0 0 0 3px #8a6a2a,0 0 0 6px #e3c47c,inset 0 0 0 2px #8a6a2a,0 14px 26px rgba(60,40,20,.35);filter:sepia(.15)}
.about h3{margin:0 0 14px;font-size:clamp(40px,5vw,56px)}
.about .cols{columns:2;column-gap:24px;font-family:"Cormorant Garamond",serif;font-size:16.5px;line-height:1.5;text-align:justify;hyphens:auto}
.about .cols p{margin:0 0 10px}
/* what I do */
.do h3{text-align:center;margin:0 0 6px;font-size:clamp(38px,5vw,52px)}
.do .lead{text-align:center;font-family:"Cormorant Garamond",serif;font-size:19px;max-width:560px;margin:0 auto 34px}
.do .lead b{font-weight:600}
.do .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;text-align:center}
.do .ic{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;background:#efe3cc;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #d8c8ab}
.do .ic svg{width:40px;height:40px}
.do h4{margin:0 0 8px;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:14px;letter-spacing:.22em;text-transform:uppercase}
.do .rule{width:34px;height:1px;background:#c9a24f;margin:0 auto 10px}
.do p{margin:0;font-family:"Cormorant Garamond",serif;font-size:15.5px;line-height:1.45}
/* timeline */
.tl{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr);gap:30px;align-items:center}
.tl h3{margin:0 0 14px;font-size:clamp(38px,5vw,52px)}
.tl ul{list-style:none;margin:0;padding:0;columns:2;column-gap:26px;font-family:"Cormorant Garamond",serif;font-size:16px;line-height:1.35}
.tl li{break-inside:avoid;margin:0 0 10px;padding-left:0}
.tl li i{color:#5d7a6e}
.tl .snap{justify-self:center;width:min(220px,100%);aspect-ratio:1;background:url(s_barbie.jpg) center/cover;padding:0;border:10px solid #fbf7ef;border-bottom-width:34px;transform:rotate(4deg);box-shadow:0 12px 24px rgba(60,40,20,.28)}
/* finale with envelope */
#contact{position:relative;background:url(s_poppy.jpg) center 40%/cover;padding:clamp(130px,16vw,190px) 20px clamp(60px,9vw,90px);text-align:center;overflow:hidden}
#contact::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(243,234,216,.22),rgba(60,30,20,.25) 60%,rgba(30,14,8,.45))}
#contact > *:not(.pothos):not(.pothos2){position:relative}
#contact .ww{display:flex;justify-content:center;gap:clamp(30px,10vw,110px);color:#f6ecd9;margin-bottom:clamp(90px,14vw,130px);text-shadow:0 2px 10px rgba(0,0,0,.4)}
#contact .ww .script{color:#f2b6bf;font-size:clamp(34px,5vw,48px)}
#contact .ww p{margin:4px 0 0;font-family:"Cormorant Garamond",serif;font-size:18px}
.env{position:relative;width:min(420px,92%);margin:0 auto;aspect-ratio:1.42;background:linear-gradient(160deg,#6d1b2b,#3e0c16);border-radius:6px;box-shadow:0 26px 50px rgba(0,0,0,.5);overflow:visible}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.6%,rgba(0,0,0,.18) 50%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 49.6%,rgba(0,0,0,.18) 50%) right/50% 100% no-repeat;border-radius:6px}
.env .card{position:absolute;left:9%;right:9%;top:-30%;background:#fbf4e8 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");border-radius:3px;padding:20px 18px 18px;box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .5s ease}
.env:hover .card{transform:translateY(-10px)}
.env .card .k{font-family:"Cormorant Garamond",serif;font-weight:600;letter-spacing:.18em;color:#b0505e;font-size:17px}
.env .card .mail{display:inline-block;margin-top:6px;font-family:"Pinyon Script",cursive;font-size:clamp(20px,3.6vw,27px);color:#3d2a22;text-decoration:none;border-bottom:1px solid rgba(61,42,34,.3)}
.env .front{position:absolute;inset:0;border-radius:6px;background:linear-gradient(160deg,#7a2233,#4a0f1b);clip-path:polygon(0 30%,50% 64%,100% 30%,100% 100%,0 100%)}
.env .mono{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);font-family:"Cormorant Garamond",serif;font-size:26px;color:#d9a85d;letter-spacing:.06em}
#contact .cta{margin-top:34px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
#contact .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-family:"Cormorant Garamond",serif;font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
#contact .btn.solid{background:#f6ecd9;color:#4a0f1b}
#contact .btn.ghost{border:1.5px solid #f6ecd9;color:#f6ecd9}
#contact .links{margin:30px auto 0;display:flex;justify-content:center;gap:clamp(18px,5vw,50px);flex-wrap:wrap;list-style:none;padding:0}
#contact .links a{color:#f6ecd9;text-decoration:none;font-family:"Cormorant Garamond",serif;font-size:14px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.5)}
#contact .links span{display:block;margin-top:2px;font-family:"Pinyon Script",cursive;font-size:21px;letter-spacing:0;text-transform:none;color:#f2b6bf}
.pothos{position:absolute;left:4px;top:-8px;width:clamp(150px,20vw,250px);pointer-events:none;filter:drop-shadow(0 6px 6px rgba(40,50,20,.25));z-index:3}
.pothos2{position:absolute;right:4px;top:-8px;width:clamp(150px,20vw,250px);transform:scaleX(-1);pointer-events:none;filter:drop-shadow(0 -4px 6px rgba(40,50,20,.2));z-index:3}
@media (max-width:720px){
  .about,.tl{grid-template-columns:1fr}
  .about .cols,.tl ul{columns:1}
  .photos{min-height:0;width:100%;max-width:340px;margin:0 auto;padding-bottom:30px}
  .pothos,.pothos2{width:130px}
  #contact{padding-top:150px}
  #contact .ww{flex-direction:column;gap:14px;margin-bottom:120px}
  .do .grid{grid-template-columns:1fr 1fr}
  #story{background-attachment:scroll}
  #contact .btn{width:100%;justify-content:center}
  .env .card{top:-38%}
}

/* footer: watercolour sky */
body{overflow-x:hidden;overflow-y:auto}
#foot{position:relative;min-height:min(600px,92svh);display:grid;place-items:center;text-align:center;padding:90px 20px 110px;overflow:hidden;color:#fbf8ef;
  background:radial-gradient(ellipse 70% 60% at 30% 30%,rgba(255,255,255,.18),transparent 70%),radial-gradient(ellipse 60% 50% at 80% 70%,rgba(60,80,40,.18),transparent 70%),linear-gradient(180deg,#a9b98d 0%,#93a877 55%,#86a06b 100%)}
#foot::before{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='.012 .02' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>")}
#foot .torn{position:absolute;left:0;top:-58px;width:100%;height:60px;z-index:4}
#foot{overflow:visible!important;z-index:3}
#foot .wrap{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);align-items:center;gap:clamp(20px,5vw,70px);max-width:1040px;width:100%;text-align:left}
#foot .art{position:relative;justify-self:end;width:min(100%,400px);padding-top:110px}
#foot .lotus{display:block;width:100%;filter:drop-shadow(0 10px 16px rgba(40,60,30,.25));margin:0}
#foot .bird{position:absolute;left:44%;top:0;width:34%;filter:drop-shadow(0 8px 10px rgba(40,60,30,.25));animation:hover 4.5s ease-in-out infinite;transform-origin:30% 40%}
@keyframes hover{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(-6px,-10px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){#foot .bird{animation:none}}
#foot .in{max-width:520px;text-align:left!important}
#foot .in h2 i{padding-left:0!important}
#foot .in p{margin:18px 0 0!important}
#foot .in .cta,#foot .in .soc{justify-content:flex-start!important}
#dots{bottom:calc(64px + env(safe-area-inset-bottom,0px))!important}
#cue{bottom:calc(40px + env(safe-area-inset-bottom,0px))!important}
#foot h2 i{padding-left:0}
#foot p{margin-left:0}
#foot .cta,#foot .soc{justify-content:flex-start}
@media (max-width:720px){#foot .art{justify-self:center;width:240px;padding-top:70px}#foot .in{text-align:center!important;margin:0 auto}#foot .in p{margin:18px auto 0!important}#foot .in .cta,#foot .in .soc{justify-content:center!important}#foot .wrap{grid-template-columns:1fr;text-align:center}#foot .lotus{width:100%;margin:0 0 -10px}#foot .cta,#foot .soc{justify-content:center}#foot p{margin-left:auto}}
#foot .clouds{position:absolute;inset:0;width:100%;height:100%;animation:drift 60s linear infinite alternate}
@keyframes drift{from{transform:translateX(-2%)}to{transform:translateX(2%)}}
#foot .meadowX{position:absolute;left:-10px;bottom:-4px;width:clamp(240px,34vw,420px);z-index:1}
#foot .flyX{position:absolute;left:clamp(150px,22vw,300px);bottom:clamp(150px,20vw,230px);width:30px;z-index:1;animation:flut 5s ease-in-out infinite}
@keyframes flut{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(14px,-12px) rotate(8deg)}}
#foot .in{position:relative;z-index:2;max-width:560px}
#foot h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,54px);line-height:1.05;text-shadow:0 2px 14px rgba(40,60,30,.25)}
#foot h2 i{display:block;padding-left:1.4em}
#foot p{margin:18px auto 0;max-width:420px;font-size:13px;line-height:1.6;color:rgba(251,248,239,.92)}
#foot .mail{color:#fbf8ef;font-family:var(--display);font-style:italic;font-size:clamp(18px,2.4vw,22px);text-decoration:none;border-bottom:1px solid rgba(251,248,239,.5)}
#foot .cta{margin-top:26px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

try { const g = document.getElementById("ghost"); g.style.backgroundImage = `url(${DATA.pages[0]})`; requestAnimationFrame(() => g.classList.add("on")); } catch (e) {}

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, LITE ? 1.5 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene.background = new THREE.Color(0x3d5a26);
scene.fog = new THREE.Fog(0x000000, 6, 16);

const book = new THREE.Group(); world.add(book);

{ const c = gcv.getContext("2d"); c.fillStyle = "#14400a"; c.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++){ const x = Math.random() * 512, y = Math.random() * 512, l = 14 + Math.random() * 26, a = Math.random() * Math.PI * 2;
    const t = Math.random(); c.strokeStyle = t < .45 ? "rgba(30,92,12,.6)" : t < .8 ? "rgba(52,128,18,.55)" : t < .95 ? "rgba(96,170,30,.5)" : "rgba(14,46,6,.6)";
    c.lineWidth = 1 + Math.random() * 1.6; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + Math.cos(a) * l * .5 + 3, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke(); } }
const groundTex = new THREE.CanvasTexture(gcv);
groundTex.encoding = THREE.sRGBEncoding;
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
groundTex.repeat.set(14 / 1.6, 14 / 1.6);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(14, 14),
  new THREE.MeshBasicMaterial({ map: groundTex, fog: false }));
// soft contact shadow under the magazine (follows the open/closed state)
const shCv = document.createElement("canvas"); shCv.width = 128; shCv.height = 160;
{ const c = shCv.getContext("2d"); c.filter = "blur(7px)"; c.fillStyle = "rgba(0,0,0,.85)"; c.fillRect(14, 14, 100, 132); }

      return;
    }
    if (z && z.copy){
      const done = () => say("Copied: " + z.copy);
      try { navigator.clipboard.writeText(z.copy).then(done).catch(() => say(z.copy)); }
      catch (err){ say(z.copy); }
      return;
    }
    if (l.i === state) next(); else prev();
    return;
  }
  const fwd = d.startP < 0.5;
  const done = fwd ? l.p > 0.22 : l.p < 0.78;
  const to = fwd ? (done ? 1 : 0) : (done ? 0 : 1);
  animateLeaf(l, to, 0);
  state = to === 1 ? l.i + 1 : l.i;
  focus = to === 1 ? "L" : "R";
  turned();
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("pointerleave", () => { if (!drag) mouse.x = mouse.y = 0; });

// ---------- loop ----------
let started = false, t0 = 0;
manager.onLoad = () => {
  const wait = Math.max(0, 2200 - performance.now());
  setTimeout(() => { document.getElementById("intro").classList.add("gone"); started = true; t0 = performance.now(); }, reduce ? 0 : wait);
};
const tiltY = { v: 0 }, tiltX = { v: 0 };
let lastNow = performance.now();
let onStage = true;
new IntersectionObserver(es => { onStage = es[0].isIntersecting; }, { threshold: 0.02 }).observe(stage);
function tick(now){
  requestAnimationFrame(tick);
  if (!onStage){ lastNow = now; return; }
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  const k = r => reduce ? 1 : 1 - Math.exp(-dt * r);
  for (const l of leaves){
    if (l.anim){
      const a = l.anim, t = (now - a.t0) / a.dur;
      if (t >= 0){
        const k = Math.min(1, t);
        l.p = a.from + (a.to - a.from) * ease(k);
        if (k >= 1){ l.p = a.to; l.anim = null; }
      }
    }
    if (Math.abs(l.p - l.last) > 1e-5) deform(l);
  }
  const lerp = k(3.5);
  if (started || reduce) camDist += (camTarget - camDist) * k(2.6);
  offX += (offTarget - offX) * k(4.2);
  book.position.x = offX;
  if (!reduce && !drag){
    tiltY.v += (mouse.x * 0.07 - tiltY.v) * lerp;
    tiltX.v += (mouse.y * 0.05 - tiltX.v) * lerp;
  }
  world.rotation.y = tiltY.v;
  world.rotation.x = (world.userData.tilt || TILT) + tiltX.v;
  const breathe = reduce ? 0 : Math.sin(now / 2200) * 0.006;
  world.position.y = breathe;
  camera.position.set(0, 0, camDist);
  camera.lookAt(0, 0, 0);
  meadow.update(now, dt, offX);
  room.update(now, dt);
  magic.update(now, renderer.domElement.height);
  if (VID) updateVideos(now);
  try { renderer.render(scene, camera); } catch (e) { Object.values(vpages).forEach(vp => { if (!vp.broken){ vp.broken = true; resetPage(vp); } }); }
}
requestAnimationFrame(tick);
})();
